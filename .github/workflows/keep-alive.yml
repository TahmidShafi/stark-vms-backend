name: Keep Render and Aiven Awake

on:
  schedule:
    # Runs every 14 minutes to prevent Render (15m timeout) & Aiven from sleeping
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  ping-backend-and-db:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Dashboard Summary Endpoint (Hits Render + Aiven MySQL)
        run: |
          echo "Pinging Stark VMS Backend & Database..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 https://stark-vms-backend.onrender.com/api/dashboard/summary)
          echo "Response HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Backend was cold or unreachable (HTTP $HTTP_STATUS). Retrying in 15 seconds..."
            sleep 15
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 https://stark-vms-backend.onrender.com/api/dashboard/summary)
            echo "Retry HTTP Status: $HTTP_STATUS"
          fi
          if [ "$HTTP_STATUS" -ne 200 ]; then
            exit 1
          fi